name: Audio edition (make an episode, send nothing)

# Makes the audio for an issue that has already gone out, from the copy
# published on gh-pages, and publishes the MP3 and podcast feed. It sends no
# email and runs no collection or model call for the brief itself — re-running
# the daily workflow instead would write a different brief and mail the list
# twice. The daily workflow makes each new day's episode on its own; this is
# for a day it missed, or for trying audio out.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date, YYYY-MM-DD. Leave as 'today' for today's issue."
        type: string
        default: today

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ffmpeg masters the audio edition: pauses, the sting, podcast loudness.
      # From PyPI (a static build in the imageio-ffmpeg wheel), not apt:
      # apt-get hung for the job's whole time limit on 7 October. Capped at
      # two minutes and never fatal: without it the episode is plain joined
      # speech and the brief is unaffected.
      - name: Install ffmpeg for the audio edition
        timeout-minutes: 2
        continue-on-error: true
        run: pip install imageio-ffmpeg || echo "::warning title=ffmpeg not installed::audio will be unmastered"

      - name: Make the episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TTS_MODEL: ${{ vars.TTS_MODEL }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          TTS_STYLE: ${{ vars.TTS_STYLE }}
          TTS_PACE: ${{ vars.TTS_PACE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          WEB_URL: https://andysaulim.github.io/Daily-Korea-Digest
        run: python podcast.py --issue "${{ inputs.date }}" --out public

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./public
          keep_files: true
