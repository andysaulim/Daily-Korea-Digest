name: Daily Korea News Digest

on:
  schedule:
    # Safety-net fallback only — primary trigger is external (cron-job.org)
    # If external trigger already succeeded today, these skip automatically.
    - cron: '30 11 * * *'  # 7:30 AM ET — fallback if external cron missed
    - cron: '0 13 * * *'   # 9:00 AM ET — last resort
  workflow_dispatch: # Primary trigger via external cron (cron-job.org)
    inputs:
      force_send:
        description: 'Send even outside the 7 AM ET delivery window. The external cron posts no inputs, so it is unaffected.'
        type: boolean
        default: false
      send_to:
        description: >-
          Test send: deliver this run to these addresses only, comma-separated.
          Leave blank for the normal distribution list. Use it to prove a new
          mail path — a different SMTP server, a changed From address — against
          a real issue before the list is anywhere near it.
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  # The duplicate-send guard reads this workflow's own runs and their steps.
  actions: read

# One run at a time. The guard below decides from what earlier runs did, so two
# runs deciding at once could both conclude nothing was sent (the old count
# treated two in-progress fallbacks as "dispatch is running" and skipped both).
# Queued, never cancelled mid-run: a newer trigger replaces only a pending one,
# and that one would have skipped anyway.
concurrency:
  group: daily-korea-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Guard: for fallback crons, skip if dispatch already succeeded today
      - name: Check if already sent today
        id: guard
        env:
          # The job's own token, scoped by the permissions block above. GH_PAT
          # was used here, and an expired or mis-scoped PAT made every query
          # fail, the count read 0, and the fallback sent a second copy.
          GH_TOKEN: ${{ github.token }}
          WEB_URL: https://andysaulim.github.io/Daily-Korea-Digest
        run: |
          # Earliest hour this brief may reach the list, in ET. The Japan
          # edition mailed its list at 00:44 and the Australia one at 00:00
          # because nothing enforced a delivery hour and the external cron can
          # fire at any time. Korea's own dispatch path ran unconditionally,
          # which is how 7 September went out at 1:09 PM.
          EARLIEST_ET="${{ vars.EARLIEST_SEND_HOUR_ET || '7' }}"
          HOUR_ET=$(TZ=America/New_York date +%-H)
          # A test send goes to named addresses, never the list, so the
          # delivery-hour floor has nothing to protect and only makes the path
          # untestable outside one hour of the morning.
          if [ "$HOUR_ET" -lt "$EARLIEST_ET" ] \
             && [ "${{ inputs.force_send }}" != "true" ] \
             && [ -z "${{ inputs.send_to }}" ]; then
            echo "::notice::${HOUR_ET}:00 ET is before the ${EARLIEST_ET}:00 ET earliest send — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A test send never reaches the list, and force_send is the operator
          # asking for a second copy on purpose. Neither consults the history.
          if [ "${{ inputs.force_send }}" = "true" ] || [ -n "${{ inputs.send_to }}" ]; then
            echo "Forced or test send — running"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Has today's brief already gone to the list? Asked of every trigger,
          # the external dispatch included: cron-job.org retrying a dispatch it
          # thought had timed out would otherwise mail the list twice.
          #
          # A run counts only if its "Generate and send digest" step succeeded.
          # The old check counted runs whose CONCLUSION was success, and a run
          # that skipped (this guard, or the delivery-hour floor) concludes
          # success too. After DST ends the 7:30 fallback fires at 6:30 EST, is
          # skipped by the hour floor, and that skip then stopped the 9:00
          # fallback: no brief at all on a day the external cron missed. It
          # also missed the opposite case, a run that sent and then failed in
          # a later step, which the fallback would send again.
          REPO="${{ github.repository }}"
          day_et=$(TZ=America/New_York date +%F)
          since=$(date -u -d "TZ=\"America/New_York\" $day_et 00:00" +%FT%TZ)
          sent=""; unknown=""
          if ids=$(gh api "repos/$REPO/actions/workflows/daily-digest.yml/runs?created=%3E%3D$since&per_page=100" \
                     --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id'); then
            for id in $ids; do
              if n=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                       --jq '[.jobs[].steps[]? | select(.name == "Generate and send digest" and (.conclusion == "success" or .status == "in_progress"))] | length'); then
                if [ "${n:-0}" -gt 0 ]; then sent="$id"; break; fi
              else
                unknown="yes"
              fi
            done
          else
            unknown="yes"
          fi
          if [ -n "$sent" ]; then
            echo "Today's brief already went out in run $sent — skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$unknown" ]; then
            # Could not read the run history. Today's page is the second
            # witness: only a run that sent deploys it. Read from the deploy
            # branch as well as the site, since Pages has been switched off
            # before (3 October) while the branch kept every file.
            if curl -sfI -o /dev/null "$WEB_URL/digest_$day_et.html" \
               || curl -sfI -o /dev/null "https://raw.githubusercontent.com/$REPO/gh-pages/digest_$day_et.html"; then
              echo "::warning title=Send guard degraded::run history unreadable; digest_$day_et.html is published, so treating today as sent"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning title=Send guard degraded::run history unreadable and no page for $day_et on the site; sending"
          fi
          echo "Nothing sent yet today — running"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.should_run == 'true'

      # The committed trackers, kept aside before the cache restore overwrites
      # them, so the newer copy can be chosen afterwards (restore_state.py).
      - name: Keep the committed tracker state
        if: steps.guard.outputs.should_run == 'true'
        run: python3 restore_state.py stash

      - name: Restore tracker data from cache
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            kim_tracker.json
            kcna_tracker.json
            bp_tracker.json
            feed_health.json
            gnews_cache.json
            metrics.jsonl
          key: tracker-data-v1
          restore-keys: |
            tracker-data-

      # A cache miss used to reset every tracker to an empty baseline, which
      # was then saved and carried forward. Picks the newer of cache and
      # repository for each, merges metrics.jsonl, and annotates a cold start.
      - name: Reconcile tracker state
        if: steps.guard.outputs.should_run == 'true'
        run: python3 restore_state.py reconcile

      - name: Set up Python
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      # ffmpeg masters the audio edition: pauses, the sting, podcast loudness.
      # From PyPI (a static build in the imageio-ffmpeg wheel), not apt:
      # apt-get hung for the job's whole time limit on 7 October. Capped at
      # two minutes and never fatal: without it the episode is plain joined
      # speech and the brief is unaffected.
      - name: Install ffmpeg for the audio edition
        if: steps.guard.outputs.should_run == 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: pip install imageio-ffmpeg || echo "::warning title=ffmpeg not installed::audio will be unmastered"

      # Between install and send, so a regression stops the run instead of
      # reaching the list. NOT continue-on-error: a failing check is a reason
      # to hold the brief, which is the whole point of having one.
      - name: Offline checks
        if: steps.guard.outputs.should_run == 'true'
        run: python3 test_sources.py

      # The suite above is a hard gate on the send, so it must not be able to
      # fail with the calendar. This runs it a year out. continue-on-error:
      # a time bomb a year away is worth a red run, never a held brief.
      - name: Suite is time-independent
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python3 timetravel.py 365 test_sources.py

      - name: Install Chromium for PDF export
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      # The visual check: contrast, typeface count and horizontal overflow,
      # measured in a real browser. None of it is visible by reading the
      # HTML, which is why it kept being found by eye instead. Needs the
      # browser installed below, so it runs after that step.
      # continue-on-error, deliberately, and it was not before.
      #
      # This measures contrast, type size and overflow in a real browser. That
      # is worth knowing and worth a red run, but it is NOT worth a missing
      # brief: on 11 September the weekly Gallup baseline update populated a
      # sparkline caption that had always been 9px at 2.55:1, the check caught
      # it correctly, and the send was cancelled over a caption. A data change
      # should never be able to stop the morning.
      #
      # The offline checks above stay blocking. They test the pipeline's own
      # invariants and cannot be tripped by the day's news.
      - name: Visual checks
        if: steps.guard.outputs.should_run != 'false'
        continue-on-error: true
        run: |
          python3 preview.py
          BRIEF_HTML=preview.html python3 test_render_visual.py

      # The guard identifies a sent brief by this step's name succeeding, so a
      # test send runs as a separate step (below) and is never mistaken for it.
      - name: Generate and send digest
        if: steps.guard.outputs.should_run == 'true' && inputs.send_to == ''
        id: send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # Optional: the same issue in the candidate design, to these
          # addresses only (run.send_design_preview). Unset sends nothing.
          DESIGN_PREVIEW_TO: ${{ vars.DESIGN_PREVIEW_TO || secrets.DESIGN_PREVIEW_TO }}
          # Optional. Unset is fine: send_email.py already defaults the reply
          # and visible-to addresses to alim@csis.org. GMAIL_FROM only works
          # once that address is verified in Gmail under Send mail as —
          # otherwise Gmail rewrites the From header back to the account.
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          DIGEST_REPLY_TO: ${{ secrets.DIGEST_REPLY_TO }}
          DIGEST_VISIBLE_TO: ${{ secrets.DIGEST_VISIBLE_TO }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME }}
          # Set these three to send through the institution's own server, which
          # is the only way to make the From address alim@csis.org when a Gmail
          # alias cannot be verified. Port 587 uses STARTTLS, 465 uses SSL.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          X_SCRAPER_KEY: ${{ secrets.X_SCRAPER_KEY }}
          # Audio edition. With no key the script is still written and the
          # brief is unaffected; with one, an MP3 and podcast feed are
          # published and the email gains a Listen link.
          TTS_MODEL: ${{ vars.TTS_MODEL }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          TTS_STYLE: ${{ vars.TTS_STYLE }}
          TTS_PACE: ${{ vars.TTS_PACE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          # Download counting via OP3 on the feed's enclosures; on unless set to 0.
          PODCAST_OP3: ${{ vars.PODCAST_OP3 }}
          WEB_URL: https://andysaulim.github.io/Daily-Korea-Digest
        run: |
          set -o pipefail
          python run.py 2>&1 | tee /tmp/run.log
          echo "success=true" >> "$GITHUB_OUTPUT"

      # Test send: named addresses only, no audio, no archive, no deploy. Its
      # own step so that the guard above never counts it as today's brief.
      - name: Test send (not the list)
        if: steps.guard.outputs.should_run == 'true' && inputs.send_to != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          DIGEST_REPLY_TO: ${{ secrets.DIGEST_REPLY_TO }}
          DIGEST_VISIBLE_TO: ${{ secrets.DIGEST_VISIBLE_TO }}
          DIGEST_FROM_NAME: ${{ secrets.DIGEST_FROM_NAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          X_SCRAPER_KEY: ${{ secrets.X_SCRAPER_KEY }}
          WEB_URL: https://andysaulim.github.io/Daily-Korea-Digest
        run: |
          set -o pipefail
          echo "::notice::TEST SEND to ${{ inputs.send_to }} — the distribution list is not used."
          python run.py --no-push --send-to "${{ inputs.send_to }}" 2>&1 | tee /tmp/run.log

      # Post-email steps use continue-on-error so a Pages/README failure
      # doesn't mark the workflow as "failed" and trigger a duplicate
      # from the cron fallback.
      - name: Update README with run stats
        if: steps.guard.outputs.should_run == 'true' && inputs.send_to == ''
        continue-on-error: true
        run: python update_readme.py

      # Not on a test send: it rendered over today's latest.html and
      # digest_DATE.html locally, and deploying those would replace the
      # published issue with the test.
      - name: Deploy to GitHub Pages
        if: steps.guard.outputs.should_run == 'true' && inputs.send_to == ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./public
          keep_files: true

      # keep_files preserves every file ever published, which is right for the
      # HTML archive and wrong for audio: at roughly 5 MB an episode, a year of
      # daily MP3s alone would pass GitHub Pages' 1 GB site limit. Keep the 30
      # newest — the number podcast.py's feed advertises — and drop the rest.
      - name: Prune old audio from the published site
        if: steps.guard.outputs.should_run == 'true' && inputs.send_to == ''
        continue-on-error: true
        run: |
          git fetch -q origin gh-pages || exit 0
          rm -rf /tmp/ghp && git worktree add -q --detach /tmp/ghp FETCH_HEAD
          cd /tmp/ghp
          old=$(ls -1 digest_*.mp3 2>/dev/null | sort | head -n -30)
          if [ -z "$old" ]; then echo "Nothing to prune"; exit 0; fi
          # Each episode also has a transcript (.txt, .vtt), chapters
          # (.chapters.json) and a player page (listen/DATE.html); they go
          # with its MP3. --ignore-unmatch: older episodes lack some of them.
          for f in $old; do
            b="${f%.mp3}"; d="${b#digest_}"
            git rm -q --ignore-unmatch "$f" "$b.txt" "$b.vtt" "$b.chapters.json" "listen/$d.html"
          done
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Prune audio older than the 30 newest episodes [skip ci]"
          git push -q origin HEAD:gh-pages && echo "Pruned: $(echo "$old" | wc -l) episode(s)"

      - name: Commit updated README + Gallup baseline
        if: steps.guard.outputs.should_run == 'true' && inputs.send_to == ''
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # gallup_baseline.json is auto-updated when the digest reads a newer
          # Gallup poll from that day's articles (see _maybe_persist_sentiment_baseline).
          #
          # metrics.jsonl carries the per-run token counts and API cost. It was
          # kept only in the Actions cache, which GitHub evicts after seven days
          # without a hit, so the spend history could disappear without anyone
          # touching it — the same shape of loss as the archive index. Committing
          # it puts the record in the repository, where it survives. The cache
          # entry stays, since it is what carries the file between runs on the
          # same day.
          # One `git add` over three paths stages NOTHING if any one of them
          # is missing: git exits 128 on the first unmatched pathspec, and the
          # step ends there. metrics.jsonl does not exist until a run has
          # written one, so on any run that did not, README and the Gallup
          # baseline were not committed either. Staged one at a time, a file
          # that is not there costs only itself.
          # The trackers are committed for the same reason as metrics.jsonl:
          # the cache is evicted after seven idle days, and a miss used to
          # restart each one from an empty baseline. restore_state.py picks
          # the newer of the two copies at the start of the next run.
          for f in README.md gallup_baseline.json metrics.jsonl \
                   kim_tracker.json kcna_tracker.json bp_tracker.json feed_health.json; do
            [ -e "$f" ] && git add "$f" || echo "  (no $f this run)"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update README stats, Gallup baseline, run metrics, trackers [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      - name: Save tracker data to cache
        if: always() && steps.guard.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            kim_tracker.json
            kcna_tracker.json
            bp_tracker.json
            feed_health.json
            gnews_cache.json
            metrics.jsonl
          key: tracker-data-v1-${{ github.run_id }}

      - name: Send failure alert
        if: failure() && steps.guard.outputs.should_run == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: |
          python -c "
          import smtplib, os
          from email.mime.text import MIMEText
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/New_York')).strftime('%Y-%m-%d %I:%M %p ET')
          tail = ''
          try:
              with open('/tmp/run.log', encoding='utf-8', errors='replace') as f:
                  lines = f.read().splitlines()
              tail = chr(10).join(lines[-60:])
          except OSError:
              tail = '(no run log captured — the job failed before python run.py started)'
          body = f'The Korea Daily Brief pipeline failed at {now}.' + chr(10)*2 + 'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' + chr(10)*2 + 'The next fallback cron will retry automatically.' + chr(10)*2 + '--- last 60 lines of the run ---' + chr(10) + tail
          msg = MIMEText(body)
          msg['Subject'] = f'⚠ Korea Daily Brief FAILED — {now}'
          msg['From'] = os.environ['GMAIL_USER']
          msg['To'] = 'alim@csis.org'
          with smtplib.SMTP_SSL('smtp.gmail.com', 465, timeout=15) as s:
              s.login(os.environ['GMAIL_USER'], os.environ['GMAIL_APP_PASS'])
              s.sendmail(os.environ['GMAIL_USER'], msg['To'].split(','), msg.as_string())
          print('Failure alert sent')
          "
